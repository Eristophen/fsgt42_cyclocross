<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Challenge CX Loire</title><link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap"><style id="page-css">/* Layout : bandeau "rubalise" + onglets, puis une colonne de travail (tableaux défilants) */
:root{
  --bg:#edf0eb;--surface:#ffffff;--sunk:#e2e7e0;--ink:#18201b;--muted:#59645c;--line:#cfd6cc;
  --accent:#1e6b47;--accent-ink:#ffffff;--tape:#f0b021;--tape-ink:#231c05;
  --warn:#a3470f;--warn-bg:#fbe9dc;--bad:#b3261e;--bad-bg:#fbe3e0;--ok:#1e6b47;--ok-bg:#dcefe3;
  --gold:#f3d36b;--silver:#d6dbe0;--bronze:#e7b98f;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613;--surface:#19201b;--sunk:#222b25;--ink:#e4ebe5;--muted:#9aa79e;--line:#2f3a33;
  --accent:#5cc08c;--accent-ink:#0b1a11;--tape:#f2c14e;--tape-ink:#231c05;
  --warn:#f0a36b;--warn-bg:#3a2415;--bad:#ff8a80;--bad-bg:#3d1c1a;--ok:#5cc08c;--ok-bg:#15311f;
  --gold:#8a6d12;--silver:#4a525a;--bronze:#7a4b26;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613;--surface:#19201b;--sunk:#222b25;--ink:#e4ebe5;--muted:#9aa79e;--line:#2f3a33;
  --accent:#5cc08c;--accent-ink:#0b1a11;--tape:#f2c14e;--tape-ink:#231c05;
  --warn:#f0a36b;--warn-bg:#3a2415;--bad:#ff8a80;--bad-bg:#3d1c1a;--ok:#5cc08c;--ok-bg:#15311f;
  --gold:#8a6d12;--silver:#4a525a;--bronze:#7a4b26;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.tape{height:10px;background:repeating-linear-gradient(-45deg,var(--tape) 0 14px,var(--ink) 14px 28px)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:18px 0}
.brand{min-width:0}
.eyebrow{font-family:var(--f-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1;margin:.1em 0 .2em;text-wrap:balance}
.season{display:flex;gap:8px;align-items:center;padding-bottom:10px}
.season select{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.02em;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button.admin{color:var(--warn)}
nav.tabs button.admin[aria-current="page"]{border-bottom-color:var(--warn);color:var(--ink)}
nav.tabs .sep{width:1px;background:var(--line);margin:10px 6px}
main{padding-block:20px 60px}
.adminbar{background:var(--tape);color:var(--tape-ink)}
.adminbar .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:8px}
.adminbar b{font-family:var(--f-display);font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dark{background:var(--tape-ink);color:var(--tape);border-color:var(--tape-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lede{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:baseline;margin-bottom:16px}
.lede h2{font-family:var(--f-display);font-size:26px;margin:0;font-weight:700}
.lede p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:14px}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--sunk);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td.c,th.c{text-align:center}
td.name{font-weight:600}
td.name button{all:unset;cursor:pointer}
td.name button:hover{text-decoration:underline}
.pl{display:inline-grid;place-items:center;min-width:28px;height:24px;padding:0 4px;border-radius:4px;font-family:var(--f-display);font-weight:700;font-size:16px}
tr.p1 .pl{background:var(--gold)}tr.p2 .pl{background:var(--silver)}tr.p3 .pl{background:var(--bronze)}
.ratio{font-family:var(--f-display);font-weight:700;font-size:17px}
.code{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.03em;padding:1px 6px;border-radius:3px;background:var(--sunk);color:var(--muted)}
.code.ABD{background:var(--warn-bg);color:var(--warn)}
.muted{color:var(--muted)}
.small{font-size:13px}
.badge{font-size:12px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.race{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;cursor:pointer;text-align:left}
.race:hover{border-color:var(--muted)}
.race .d{grid-row:span 3;font-family:var(--f-display);text-align:center;line-height:1;border-right:1px solid var(--line);padding-right:14px;min-width:54px}
.race .d b{display:block;font-size:30px}
.race .d span{font-size:13px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.race h3{margin:0;font-size:17px;font-family:var(--f-display);font-weight:700}
.race.next{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:grid;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;min-width:0}
textarea{width:100%;min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.search{width:100%;max-width:420px;padding:9px 12px}
.rev td{padding:4px 6px}
.rev input[type=text]{width:220px}
.rev input.o{width:52px;text-align:right}
.rev tr.unk{background:var(--bad-bg)}
.rev tr.fuzzy{background:var(--warn-bg)}
.rev td.raw{max-width:260px;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:13px}
.notice{border-radius:var(--r);padding:10px 14px;background:var(--ok-bg);color:var(--ok)}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.kpis{display:flex;flex-wrap:wrap;gap:10px 32px}
.kpi b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.split{grid-template-columns:1fr}.rev input[type=text]{width:160px}}
details summary{cursor:pointer;font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);z-index:9;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.race,.btn,.chip{transition:border-color .15s,background .15s}}

/* ---------- index des coureurs pour la reconnaissance des noms ---------- */
let IDX=null;
function buildIndex(){IDX={k:new Map(),tok:new Map(),pre:new Map()};S.riders.forEach(r=>{const k=key(r.n);if(!IDX.k.has(k))IDX.k.set(k,r.id);norm(r.n).split(' ').forEach(t=>{if(t.length>=4){const q=t.slice(0,4);if(!IDX.pre.has(q))IDX.pre.set(q,[]);IDX.pre.get(q).push(r.id)}if(t.length<3)return;if(!IDX.tok.has(t))IDX.tok.set(t,[]);IDX.tok.get(t).push(r.id)})})}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>3)return 9;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}

const CODE_RE=/^(ABD|AB|DNF|PB|VTT|B|NC|NP|DNS)$/i;
function parseBlock(text){
  const rows=[];
  text.split(/\r?\n/).forEach(raw=>{
    if(!raw.trim())return;
    let cells=raw.split(/\t|;|\s{2,}/).map(c=>c.trim()).filter(Boolean);
    if(cells.length===1)cells=[cells[0]];
    let place=null,code='';
    const m=cells[0].match(/^(\d{1,3})\s*(?:[.)°]|e|er|ème)?(?:\s+(.*))?$/i);
    if(m){place=+m[1];if(m[2])cells[0]=m[2];else cells.shift()}
    const toks=[];let club='';
    cells.forEach(c=>{
      if(CODE_RE.test(c)){const u=c.toUpperCase();code=(u==='AB'||u==='DNF')?'ABD':(u==='NP'||u==='DNS')?'':u;return}

    const guess=cells.filter(c=>!CODE_RE.test(c)&&!/^[\d\s:'"h.,+-]+$/.test(c)&&c!==club)[0]||toks.join(' ');

  });

}

    </tbody></table></div><p class="small muted">Les points en gris sont calculés automatiquement. Tape une valeur (nombre ou code) seulement pour forcer un résultat.</p>`:''}

  <div class="row" style="margin-top:14px"><button class="btn small" data-act="addblock">+ Ajouter un départ (jeunes…)</button></div>

/* ---------- ADMIN : import de la liste officielle des licenciés ---------- */
function analyzeImport(text){
  const yr=new Date().getFullYear();const rows=[];
  text.split(/\r?\n/).forEach(l=>{
    let c=l.split('\t').map(x=>x.trim());if(c.length<2)c=l.split(';').map(x=>x.trim());
    if(c.length<2||!c[0]||!c[1])return;
    if(/^nom\b/i.test(c[0])||/^total/i.test(c[0]))return;
    const a=(c[2]||'').trim();let y=null;if(/^\d{4}$/.test(a))y=+a;else if(/^\d{1,3}$/.test(a))y=yr-(+a);
    rows.push({name:c[0].replace(/\s+/g,' '),club:c[1].replace(/\s+/g,' '),y});
  });
  if(!IDX)buildIndex();
  const res={rows,matched:[],news:[],clubs:{},missing:[],resetMissing:true};const seen=new Set();
  rows.forEach(x=>{
    const k=key(x.name);let id=IDX.k.get(k),fz=false;
    if(!id||seen.has(id)){id=null;const toks=k.split(' ');let bd=3,best=null;const cand=new Set();toks.forEach(t=>{(IDX.tok.get(t)||[]).forEach(i=>cand.add(i));if(t.length>=4)(IDX.pre.get(t.slice(0,4))||[]).forEach(i=>cand.add(i))});
      cand.forEach(i=>{if(seen.has(i))return;const rk=key(E.RIDERS[i].n);if(rk.split(' ').length!==toks.length)return;const d=lev(k,rk);if(d<bd){bd=d;best=i}});
      if(best){id=best;fz=true}}
    const nl=/^NL\b/i.test(x.club);
    if(!nl&&S.clubs[x.club]===undefined)res.clubs[x.club]='';
    if(!id){res.news.push(x);return}
    seen.add(id);const r=E.RIDERS[id];const ch={};
    const lic=r.l==='VTT'?'VTT':nl?'NL':'FSGT';if(lic!==r.l)ch.l=lic;
    if(!nl&&x.club!==r.c)ch.c=x.club;
    if(x.y&&x.y!==r.y)ch.y=x.y;
    if(fz)ch.n=x.name;
    res.matched.push({id,x,fz,accept:true,ch});
  });
  res.missing=S.riders.filter(r=>r.l==='FSGT'&&!seen.has(r.id)).map(r=>r.id);
  return res;
}

function applyImport(){
  const R=V.imp.res;let n=0,u=0;
  Object.entries(R.clubs).forEach(([c,d])=>{S.clubs[c]=d.trim()});
  const mk=x=>{const nl=/^NL\b/i.test(x.club);const r={id:newRiderId(),n:x.name,c:nl?'NL':x.club,l:nl?'NL':'FSGT'};if(x.y)r.y=x.y;S.riders.push(r);E.RIDERS[r.id]=r;n++};
  R.matched.forEach(m=>{if(m.fz&&!m.accept){mk(m.x);return}const r=E.RIDERS[m.id];if(Object.keys(m.ch).length)u++;Object.assign(r,m.ch)});
  R.news.forEach(mk);
  let miss=0;if(R.resetMissing)R.missing.forEach(id=>{const r=E.RIDERS[id];if(r&&r.l==='FSGT'){r.l='';miss++}});
  S.riders.sort((a,b)=>a.n.localeCompare(b.n,'fr'));
  V.imp=null;changed();toast(`Import appliqué : ${n} nouveaux, ${u} mis à jour${miss?`, ${miss} licences à confirmer`:''}. Pense à publier.`);
}

function exportCSV(kind){
  const se=season(),st=E.standings(se);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const n=v=>typeof v==='number'?v.toFixed(2).replace('.',','):v;let lines=[];
  if(kind==='challenge'){lines.push(['Catégorie','Place','Coureur','Club','Ratio','Courses',...st.held.map(r=>r.short||r.name)].map(q).join(';'));
    catsOrder().forEach(c=>(st.challenge[c]||[]).forEach((s,i)=>lines.push([c,i+1,s.rider.n,s.rider.c,n(s.ratio),s.V,...st.held.map(r=>s.e.pts[r.id]??'')].map(q).join(';'))))}
  else{lines.push(['Rang','Coureur','Club','Catégorie','Ratio grille'].map(q).join(';'));st.grille.forEach((s,i)=>lines.push([i+1,s.rider.n,s.rider.c,s.cat,n(s.grille)].map(q).join(';')))}
  download(`${kind==='challenge'?'Classement':'Grille'}_CX_Loire_${se.id}.csv`,'﻿'+lines.join('\r\n'),'text/csv');
}

  else if(act==='addrace'){se.races.push({id:'c'+Date.now().toString(36),name:'Nouvelle course',short:'',club:'',date:'',grille:true,blocks:[]});changed()}
  else if(act==='backup')download(`Sauvegarde_CX_Loire_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(S),'application/json');
  else if(act==='newseason'){
    const last=S.seasons[S.seasons.length-1];const [a]=last.id.split('-').map(Number);const id=(a+1)+'-'+String((a+2)%100).padStart(2,'0');
